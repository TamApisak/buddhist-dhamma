<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>แม่แบบภาพสำหรับแชร์ (1200×630)</title>
<!--
  แม่แบบภาพที่แสดงเมื่อแชร์ลิงก์เว็บไซต์บน Facebook / LINE
  ไม่ต้องแก้ไฟล์นี้โดยตรง: ชื่อชมรม คำขวัญ และโลโก้ดึงมาจาก content/site.js
  สร้างภาพใหม่ด้วยคำสั่ง  node tools/make-og-image.js
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
<script src="../../content/site.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #15291D; }
  .card {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    background:
      radial-gradient(ellipse 70% 80% at 50% 30%, #2A4F38 0%, #1F3D2B 45%, #15291D 78%, #0F1F15 100%);
    color: #F7F3EA; font-family: "Sarabun", sans-serif;
  }
  .rings { position: absolute; left: 50%; top: 118px; transform: translate(-50%, -50%); }
  .content {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    text-align: center; padding-top: 58px;
  }
  .logo { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,.35); }
  .name1 {
    margin: 26px 0 0; font-family: "Noto Serif Thai", serif; font-weight: 700;
    font-size: 82px; line-height: 1.22; letter-spacing: .005em; color: #FFFDF8;
  }
  .name2 {
    margin: 2px 0 0; font-family: "Noto Serif Thai", serif; font-weight: 600;
    font-size: 50px; line-height: 1.3; color: #D9C28F;
  }
  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0 18px; }
  .divider i { display: block; width: 120px; height: 1.5px; background: linear-gradient(90deg, transparent, #B8975A); }
  .divider i:last-child { background: linear-gradient(90deg, #B8975A, transparent); }
  .divider b { width: 8px; height: 8px; transform: rotate(45deg); background: #B8975A; }
  .tagline { margin: 0; font-size: 31px; font-weight: 500; line-height: 1.5; color: rgba(247, 243, 234, .9); }
  .forest { position: absolute; left: 0; right: 0; bottom: 0; width: 1200px; height: 150px; }
</style>
</head>
<body>
<div class="card" id="card">
  <svg class="rings" width="460" height="460" viewBox="0 0 460 460" aria-hidden="true">
    <circle cx="230" cy="230" r="96"  fill="none" stroke="#B8975A" stroke-width="1.4" opacity=".55"/>
    <circle cx="230" cy="230" r="140" fill="none" stroke="#B8975A" stroke-width="1.1" opacity=".32"/>
    <circle cx="230" cy="230" r="188" fill="none" stroke="#B8975A" stroke-width="1"   opacity=".16"/>
  </svg>

  <div class="content">
    <img class="logo" id="logo" alt="">
    <h1 class="name1" id="name1"></h1>
    <p class="name2" id="name2"></p>
    <div class="divider" aria-hidden="true"><i></i><b></b><i></i></div>
    <p class="tagline" id="tagline"></p>
  </div>

  <svg class="forest" id="forest" viewBox="0 0 1200 150" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <!-- รูปต้นไม้ชุดเดียวกับ assets/forest.svg -->
      <symbol id="t1" viewBox="0 0 100 160" overflow="visible"><rect x="46" y="98" width="8" height="62" rx="3"/><ellipse cx="50" cy="40" rx="26" ry="24"/><ellipse cx="50" cy="66" rx="38" ry="46"/><ellipse cx="25" cy="92" rx="20" ry="22"/><ellipse cx="75" cy="90" rx="22" ry="24"/></symbol>
      <symbol id="t2" viewBox="0 0 100 160" overflow="visible"><rect x="46" y="118" width="8" height="42" rx="3"/><path d="M50 4 L82 58 L66 56 L90 104 L70 102 L98 148 L2 148 L30 102 L10 104 L34 56 L18 58 Z"/></symbol>
    </defs>
    <g id="back" fill="#2A4F38" opacity=".8"></g>
    <g id="front" fill="#0A1610"></g>
    <rect x="0" y="140" width="1200" height="10" fill="#0A1610"/>
  </svg>
</div>

<script>
  var S = window.SITE || {};
  document.getElementById('name1').textContent = S.nameLine1 || S.name || '';
  document.getElementById('name2').textContent = S.nameLine2 || '';
  document.getElementById('tagline').textContent = S.tagline || '';
  document.getElementById('logo').src = '../../' + (S.logo || 'assets/logo-placeholder.svg');

  // วางต้นไม้แบบสุ่มคงที่ (ได้ภาพเดิมทุกครั้งที่สร้าง)
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
  function row(id, step, y, sMin, sMax) {
    var g = document.getElementById(id), x = -60;
    while (x < 1240) {
      var s = sMin + rnd() * (sMax - sMin);
      var t = rnd() < 0.45 ? 't2' : 't1';
      var u = document.createElementNS('http://www.w3.org/2000/svg', 'use');
      u.setAttribute('href', '#' + t);
      u.setAttribute('width', '100');   // ขนาดเท่า viewBox ของ symbol ไม่เช่นนั้นต้นไม้จะถูกย่อและเลื่อนไปกลางภาพ
      u.setAttribute('height', '160');
      u.setAttribute('transform', 'translate(' + x.toFixed(1) + ' ' + (y - 160 * s).toFixed(1) + ') scale(' + s.toFixed(2) + ')');
      g.appendChild(u);
      x += step * (0.7 + rnd() * 0.6);
    }
  }
  row('back', 40, 146, 0.40, 0.62);
  row('front', 50, 154, 0.32, 0.50);
</script>
</body>
</html>
