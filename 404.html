  <script>
    (function () {
      // รายการโฟลเดอร์ที่อาจเป็นโฟลเดอร์หลักของเว็บไซต์ เรียงจากชั้นที่ลึกที่สุดขึ้นไปจนถึง "/"
      var dirs = location.pathname.split('/').slice(1, -1).filter(Boolean);
      var candidates = [];
      for (var i = dirs.length; i >= 0; i--) candidates.push('/' + dirs.slice(0, i).join('/') + (i ? '/' : ''));

      // ที่อยู่ที่ไม่ต้องแก้: มี scheme (https:, mailto:), ขึ้นต้นด้วย //, เริ่มจากราก (/), หรือเป็น #
      var SKIP = /^(?:[a-z][a-z0-9+.-]*:|\/\/|\/|#)/i;
      function absolutize(base) {
        var els = document.querySelectorAll('a[href], img[src]');
        for (var j = 0; j < els.length; j++) {
          var el = els[j], attr = el.hasAttribute('href') ? 'href' : 'src', v = el.getAttribute(attr);
          if (v && !SKIP.test(v)) el.setAttribute(attr, base + v);
        }
      }
      function loadScript(src, cb) {
        var s = document.createElement('script'); s.src = src; s.onload = cb; s.onerror = cb;
        document.head.appendChild(s);
      }
      function apply(base) {
        var fix = function () { absolutize(base); };
        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fix); else fix();
        var icon = document.createElement('link');
        icon.rel = 'icon'; icon.type = 'image/svg+xml'; icon.href = base + 'assets/favicon.svg';
        document.head.appendChild(icon);
        var link = document.createElement('link');
        link.rel = 'stylesheet'; link.href = base + 'css/style.css';
        link.onload = function () {
          document.documentElement.classList.add('site-css');
          loadScript(base + 'content/site.js', function () {
            // ปรับที่อยู่ในข้อมูลเว็บไซต์ให้ชี้จากโฟลเดอร์หลักก่อนสร้างส่วนหัว/ส่วนท้าย (กันไม่ให้โหลดโลโก้ผิดที่)
            var site = window.SITE;
            if (site) {
              if (site.logo && !SKIP.test(site.logo)) site.logo = base + site.logo;
              if (site.nav) for (var k = 0; k < site.nav.length; k++) {
                var h = site.nav[k].href;
                if (h && !SKIP.test(h)) site.nav[k].href = base + h;
              }
            }
            loadScript(base + 'js/main.js', function () { absolutize(base); });
          });
        };
        document.head.appendChild(link);
      }
      function probe(i) {
        if (i >= candidates.length) return;
        fetch(candidates[i] + 'content/site.js', { method: 'HEAD', cache: 'no-store' })
          .then(function (r) { if (r.ok) apply(candidates[i]); else probe(i + 1); }, function () { probe(i + 1); });
      }
      if (window.fetch && location.protocol !== 'file:') probe(0);
    })();
  </script>
